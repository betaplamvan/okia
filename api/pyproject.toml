[project]
name = "okia-api"
version = "0.1.0"
description = "Backend Ô Kìa — FastAPI, server quyết định mọi kết quả (docs/02)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "python-multipart>=0.0.12",
  "pyjwt[crypto]>=2.10",
  "resend>=2.0",
  "httpx>=0.27",
  "email-validator>=2.2",
  "pillow>=11",
  "tzdata>=2025.2",
  "boto3>=1.43.116",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "respx>=0.22",
  "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: `Depends(...)` trong tham số là mẫu chuẩn của FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# File migration do Alembic sinh: giữ nguyên dòng dài để diff dễ đọc.
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
