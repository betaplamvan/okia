# Dịch vụ cho môi trường dev (docs/02): Postgres, Redis. Email giao dịch gửi thật qua Resend kể cả khi dev.
# Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: okia
      POSTGRES_USER: okia
      POSTGRES_PASSWORD: okia
    ports:
      - "5433:5432" # 5432 trên máy dev có thể đã bị Postgres của dự án khác dùng
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okia -d okia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
